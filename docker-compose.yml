version: '3.9'

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cottonguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"   # also exposed directly for debugging
    environment:
      - MODEL_PATH=/app/backend/weights/resnet18_11classes.pth
    # volumes:
    #   - ./backend/weights:/app/backend/weights:ro  # mount weights read-only (optional override)

  # ── React Frontend (nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cottonguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"       # open http://localhost in browser
    depends_on:
      - backend

networks:
  default:
    name: cottonguard-network
